<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgroGranja Ko'ẽjú | Control Avícola</title>
<style>:root{--g:#155b38;--g2:#2f855a;--p:#f4f8f2;--y:#f5c542;--w:#fff;--t:#17352a;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--p);color:var(--t)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}header small{opacity:.9}.wrap{max-width:1100px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tabs button,.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs button{background:white;color:var(--g);white-space:nowrap}.tabs button.active,.btn{background:var(--g);color:white}.btn.alt{background:var(--y);color:#203629}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,.panel{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 10px #1232}.metric{font-size:26px;font-weight:800;color:var(--g)}.panel{margin-top:12px}h2{font-size:18px;margin:0 0 12px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:10px;margin-top:4px;background:#fff}textarea{min-height:70px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e3ebe6;text-align:left}th{background:#edf5f0;position:sticky;top:0}.danger{color:var(--r);font-weight:700}.pill{padding:3px 8px;border-radius:99px;background:#e8f4ec;display:inline-block}.hidden{display:none}.empty{color:#6a7d73;padding:18px;text-align:center}.note{font-size:12px;color:#65776e}@media(max-width:600px){.wrap{padding:10px}.card{padding:12px}header{position:relative}}</style></head><body>
<header><h1>🐥 AgroGranja Ko'ẽjú</h1><small>Control de Producción Avícola</small></header><div class="wrap"><div class="tabs" id="tabs"></div><main id="main"></main></div>
<script>
const modules={
Lotes:{fields:[['id','ID Lote','text'],['nombre','Nombre del lote','text'],['tipo','Tipo de ave','select',['Ponedoras','Parrilleros','Caseros','Codornices','Otros']],['linea','Línea/Raza','text'],['fecha','Fecha ingreso/nacimiento','date'],['inicial','Cantidad inicial','number'],['estado','Estado','select',['Activo','Finalizado','Vendido']],['obs','Observaciones','textarea']]},
Produccion:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['huevos','Huevos totales','number'],['rotos','Huevos rotos','number'],['sucios','Huevos sucios','number'],['obs','Observaciones','textarea']]},
Alimentacion:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['alimento','Alimento/Marca','text'],['etapa','Etapa','select',['Iniciador','Crecimiento','Terminador','Postura','Otro']],['kg','Cantidad usada (kg)','number'],['costo','Costo (Gs)','number'],['obs','Observaciones','textarea']]},
Peso:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['muestra','N° aves pesadas','number'],['prom','Peso promedio (g)','number'],['objetivo','Peso objetivo (g)','number'],['obs','Observaciones','textarea']]},
Sanidad:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['categoria','Categoría','select',['Vacuna','Vitamina/Suplemento','Antiparasitario','Antibiótico','Tratamiento','Otro']],['producto','Producto / Vacuna','text'],['motivo','Motivo / Enfermedad','text'],['dosis','Dosis','text'],['via','Vía administración','select',['Agua de bebida','Ocular','Spray','Oral individual','Inyectable','Tópica','Otra']],['duracion','Duración (días)','number'],['proxima','Próxima aplicación','date'],['estado','Estado','select',['Aplicado','Programado','Pendiente','Finalizado']],['retiro','Retiro huevo/carne','text'],['responsable','Responsable','text'],['obs','Observaciones','textarea']]},
Mortalidad:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['evento','Tipo de evento','select',['Muerte','Descarte','Venta/Salida','Otro']],['bajas','Cantidad bajas','number'],['causa','Causa probable','text'],['sintomas','Síntomas / Hallazgos','textarea'],['accion','Acción tomada','textarea'],['obs','Observaciones','textarea']]},
Costos:{fields:[['fecha','Fecha','date'],['lote','ID Lote','lote'],['categoria','Categoría','select',['Aves','Alimento','Sanidad','Equipamiento','Cama','Transporte','Otro']],['concepto','Concepto','text'],['cantidad','Cantidad','number'],['unitario','Costo unitario (Gs)','number'],['proveedor','Proveedor','text'],['obs','Observaciones','textarea']]}}
const names=['Resumen',...Object.keys(modules),'Historial / Reportes']; let current='Resumen';
function data(k){return JSON.parse(localStorage.getItem('koeju_'+k)||'[]')} function save(k,v){localStorage.setItem('koeju_'+k,JSON.stringify(v))}
function lot(id){return data('Lotes').find(x=>x.id===id)} function days(d,ref=new Date()){if(!d)return '';return Math.floor((new Date(ref)-new Date(d))/(864e5))}
function deaths(id){return data('Mortalidad').filter(x=>x.lote===id).reduce((s,x)=>s+(+x.bajas||0),0)} function birds(id){let l=lot(id);return l?Math.max(0,(+l.inicial||0)-deaths(id)):0}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tabs(){document.getElementById('tabs').innerHTML=names.map(n=>`<button class="${n===current?'active':''}" onclick="show('${n}')">${n}</button>`).join('')}
function show(n){current=n;tabs(); if(n==='Resumen')summary(); else if(n==='Historial / Reportes')reports(); else moduleView(n)}
function summary(){let ls=data('Lotes'), prod=data('Produccion'), san=data('Sanidad'), costs=data('Costos');let today=new Date().toISOString().slice(0,10);let eggs=prod.filter(x=>x.fecha===today).reduce((s,x)=>s+(+x.huevos||0),0);let due=san.filter(x=>x.proxima&&x.proxima>=today).sort((a,b)=>a.proxima.localeCompare(b.proxima)).slice(0,5);let total=costs.reduce((s,x)=>s+(+x.cantidad||0)*(+x.unitario||0),0);document.getElementById('main').innerHTML=`<div class="cards"><div class="card"><small>Lotes</small><div class="metric">${ls.length}</div></div><div class="card"><small>Aves actuales</small><div class="metric">${ls.reduce((s,l)=>s+birds(l.id),0)}</div></div><div class="card"><small>Huevos hoy</small><div class="metric">${eggs}</div></div><div class="card"><small>Costos acumulados</small><div class="metric">${total.toLocaleString('es-PY')} Gs</div></div></div><div class="panel"><h2>🩺 Próximos controles sanitarios</h2>${due.length?due.map(x=>`<p><b>${esc(x.proxima)}</b> · ${esc(x.lote)} · ${esc(x.categoria)} — ${esc(x.producto)}</p>`).join(''):'<div class="empty">No hay próximas aplicaciones registradas.</div>'}</div><div class="panel"><h2>Respaldo de datos</h2><p class="note">Los datos se guardan en este navegador. Exportá un respaldo periódicamente.</p><div class="actions"><button class="btn" onclick="exportData()">Exportar respaldo</button><label class="btn alt">Importar respaldo<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div></div>`}
function input(f){let [k,l,t,opts]=f;if(t==='textarea')return `<label class="full">${l}<textarea name="${k}"></textarea></label>`;if(t==='select')return `<label>${l}<select name="${k}"><option value="">Seleccionar</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></label>`;if(t==='lote')return `<label>${l}<select name="${k}" required><option value="">Seleccionar lote</option>${data('Lotes').map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.nombre)}</option>`).join('')}</select></label>`;return `<label>${l}<input name="${k}" type="${t}" ${['id','fecha'].includes(k)?'required':''}></label>`}
function computed(n,x){if(n==='Lotes')return [`${birds(x.id)}`,`${days(x.fecha)} días`];let l=lot(x.lote),age=l?days(l.fecha,new Date(x.fecha)):'';if(n==='Produccion')return [age,birds(x.lote),Math.max(0,(+x.huevos||0)-(+x.rotos||0)-(+x.sucios||0)),birds(x.lote)?(((+x.huevos||0)/birds(x.lote))*100).toFixed(1)+'%':''];if(n==='Alimentacion')return [age,birds(x.lote),birds(x.lote)?((+x.kg||0)*1000/birds(x.lote)).toFixed(1):''];if(n==='Peso')return [age,(+x.prom||0)-(+x.objetivo||0)+' g'];if(n==='Sanidad'||n==='Mortalidad')return [age];if(n==='Costos')return [((+x.cantidad||0)*(+x.unitario||0)).toLocaleString('es-PY')+' Gs'];return []}
function moduleView(n){let m=modules[n], rows=data(n);let extras={Lotes:['Aves actuales','Edad'],Produccion:['Edad','Aves','Comerciales','% Postura'],Alimentacion:['Edad','Aves','g/ave/día'],Peso:['Edad','Diferencia'],Sanidad:['Edad'],Mortalidad:['Edad'],Costos:['Total']}[n];document.getElementById('main').innerHTML=`<div class="panel"><h2>+ Nuevo registro — ${n}</h2><form id="form">${m.fields.map(input).join('')}<div class="full actions"><button class="btn" type="submit">Guardar registro</button></div></form></div><div class="panel"><h2>Registros</h2><div class="tablewrap"><table><thead><tr>${m.fields.map(f=>`<th>${f[1]}</th>`).join('')}${extras.map(e=>`<th>${e}</th>`).join('')}<th></th></tr></thead><tbody>${rows.length?rows.slice().reverse().map((x,ri)=>`<tr>${m.fields.map(f=>`<td>${esc(x[f[0]])}</td>`).join('')}${computed(n,x).map(v=>`<td><span class="pill">${esc(v)}</span></td>`).join('')}<td><button onclick="del('${n}',${rows.length-1-ri})">🗑️</button></td></tr>`).join(''):`<tr><td colspan="20" class="empty">Todavía no hay registros.</td></tr>`}</tbody></table></div></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(n==='Lotes'&&data('Lotes').some(x=>x.id===obj.id))return alert('Ese ID de lote ya existe.');let a=data(n);a.push(obj);save(n,a);moduleView(n)}}

function monthKey(d){return d?String(d).slice(0,7):''}
function periodRows(k,lote,period){return data(k).filter(x=>(!lote||x.lote===lote)&&(period==='all'||monthKey(x.fecha)===period))}
function reportPeriods(){let ds=[];['Produccion','Alimentacion','Peso','Sanidad','Mortalidad','Costos'].forEach(k=>data(k).forEach(x=>{if(x.fecha)ds.push(monthKey(x.fecha))}));return [...new Set(ds)].sort().reverse()}
function reports(){let ls=data('Lotes'),ps=reportPeriods(),now=new Date().toISOString().slice(0,7);let def=ps.includes(now)?now:(ps[0]||now);document.getElementById('main').innerHTML=`<div class="panel"><h2>📅 Historial / Reportes</h2><form id="reportFilters"><label>Lote<select id="reportLot"><option value="">Todos los lotes</option>${ls.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.nombre)}</option>`).join('')}</select></label><label>Período<select id="reportPeriod"><option value="${def}">${def}</option>${ps.filter(x=>x!==def).map(x=>`<option value="${x}">${x}</option>`).join('')}<option value="all">Todo el ciclo</option></select></label></form></div><div id="reportBody"></div>`;document.getElementById('reportLot').onchange=renderReport;document.getElementById('reportPeriod').onchange=renderReport;renderReport()}
function renderReport(){let lote=document.getElementById('reportLot').value,period=document.getElementById('reportPeriod').value;let p=periodRows('Produccion',lote,period),a=periodRows('Alimentacion',lote,period),m=periodRows('Mortalidad',lote,period),s=periodRows('Sanidad',lote,period),c=periodRows('Costos',lote,period),w=periodRows('Peso',lote,period);let eggs=p.reduce((z,x)=>z+(+x.huevos||0),0),commercial=p.reduce((z,x)=>z+Math.max(0,(+x.huevos||0)-(+x.rotos||0)-(+x.sucios||0)),0),feed=a.reduce((z,x)=>z+(+x.kg||0),0),loss=m.reduce((z,x)=>z+(+x.bajas||0),0),cost=c.reduce((z,x)=>z+(+x.cantidad||0)*(+x.unitario||0),0);let posture=p.length?p.reduce((z,x)=>z+(birds(x.lote)?(+x.huevos||0)/birds(x.lote)*100:0),0)/p.length:0;let events=[];p.forEach(x=>events.push([x.fecha,x.lote,'🥚 Producción',`${x.huevos||0} huevos · ${Math.max(0,(+x.huevos||0)-(+x.rotos||0)-(+x.sucios||0))} comerciales`]));a.forEach(x=>events.push([x.fecha,x.lote,'🌽 Alimentación',`${x.kg||0} kg · ${x.alimento||''}`]));s.forEach(x=>events.push([x.fecha,x.lote,'💉 Sanidad',`${x.categoria||''} · ${x.producto||''} · ${x.estado||''}`]));m.forEach(x=>events.push([x.fecha,x.lote,'⚠️ Bajas/Salidas',`${x.evento||''} · ${x.bajas||0} aves · ${x.causa||''}`]));w.forEach(x=>events.push([x.fecha,x.lote,'⚖️ Peso',`${x.prom||0} g promedio` ]));c.forEach(x=>events.push([x.fecha,x.lote,'💰 Costo',`${x.concepto||x.categoria||''} · ${((+x.cantidad||0)*(+x.unitario||0)).toLocaleString('es-PY')} Gs`]));events.sort((x,y)=>String(y[0]).localeCompare(String(x[0])));document.getElementById('reportBody').innerHTML=`<div class="cards"><div class="card"><small>Huevos totales</small><div class="metric">${eggs.toLocaleString('es-PY')}</div></div><div class="card"><small>Huevos comerciales</small><div class="metric">${commercial.toLocaleString('es-PY')}</div></div><div class="card"><small>Postura promedio*</small><div class="metric">${posture.toFixed(1)}%</div></div><div class="card"><small>Alimento</small><div class="metric">${feed.toLocaleString('es-PY')} kg</div></div><div class="card"><small>Bajas / salidas</small><div class="metric">${loss}</div></div><div class="card"><small>Eventos sanitarios</small><div class="metric">${s.length}</div></div><div class="card"><small>Costos</small><div class="metric">${cost.toLocaleString('es-PY')} Gs</div></div></div><div class="panel"><h2>Registro del período</h2><p class="note">*Promedio calculado sobre los días con producción registrada. Seleccioná “Todo el ciclo” para consultar el historial completo.</p><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Lote</th><th>Registro</th><th>Detalle</th></tr></thead><tbody>${events.length?events.map(e=>`<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td>${esc(e[3])}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No hay registros para este período.</td></tr>`}</tbody></table></div></div>`}

function del(n,i){if(confirm('¿Eliminar este registro?')){let a=data(n);a.splice(i,1);save(n,a);moduleView(n)}}
function exportData(){let o={};Object.keys(modules).forEach(k=>o[k]=data(k));let b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agrogranja_koeju_respaldo.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let o=JSON.parse(r.result);Object.keys(modules).forEach(k=>{if(Array.isArray(o[k]))save(k,o[k])});alert('Respaldo importado.');show('Resumen')}catch{alert('Archivo no válido')}};r.readAsText(f)}
tabs();summary();
</script></body></html>
